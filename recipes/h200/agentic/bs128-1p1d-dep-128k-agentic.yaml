# Long-context agentic H200 SGLang recipe.
#
# Based on recipes/h200/8k1k/bs128-1p1d-dep.yaml, with the fixed-seq
# benchmark replaced by the InferenceX trace replay custom benchmark.
name: "h200-fp8-128k-agentic-bs128-1p1d-dep"

model:
  path: "dsr1"
  container: "lmsysorg/sglang:v0.5.8.post1-cu130"
  precision: "fp8"

frontend:
  nginx_container: nginx

resources:
  gpu_type: "h200"
  prefill_nodes: 1
  prefill_workers: 1
  decode_nodes: 1
  decode_workers: 1
  gpus_per_node: 8

backend:
  prefill_environment:
    SGLANG_ENABLE_JIT_DEEPGEMM: "false"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
  decode_environment:
    SGLANG_ENABLE_JIT_DEEPGEMM: "false"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
  sglang_config:
    prefill:
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      tp-size: 8
      dp-size: 1
      ep-size: 1
      attention-backend: "flashinfer"
      disable-radix-cache: true
      watchdog-timeout: 1000000
      max-running-requests: 2
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl
      mem-fraction-static: 0.75
      context-length: 136001
      max-prefill-tokens: 163840
      chunked-prefill-size: 32768
      load-balance-method: "round_robin"
    decode:
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      tp-size: 8
      dp-size: 8
      ep-size: 8
      enable-dp-attention: true
      attention-backend: "flashinfer"
      disable-radix-cache: true
      stream-interval: 10
      watchdog-timeout: 1000000
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl
      mem-fraction-static: 0.88
      context-length: 136001
      # SGLang partitions this across decode DP ranks; values below dp-size=8
      # floor the per-rank request budget to zero during scheduler init.
      max-running-requests: 16
      cuda-graph-max-bs: 16

benchmark:
  type: "custom"
  command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"

health_check:
  # H200 loads this 163-shard FP8 checkpoint slowly from shared storage; the
  # 20 minute default can expire while both workers are still loading weights.
  max_attempts: 360
  interval_seconds: 10

# Long-context agentic B200 FP8 SGLang recipe.
#
# Based on the existing B200 FP8 8k1k SGLang recipes, with the fixed-sequence
# benchmark replaced by the InferenceX trace replay custom benchmark and the
# context/chunking limits raised for 128k agentic traces.
name: "b200-fp8-128k-agentic-tp8-1p1d"

dynamo:
  version: "0.9.1"

frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 4
  nginx_container: nginx-sqsh

model:
  path: "dsr1-fp8"
  container: "dynamo-sglang"
  precision: "fp8"

resources:
  gpu_type: "b200"
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 8
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 8
  gpus_per_node: 8

backend:
  prefill_environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "7200"
    PYTHONUNBUFFERED: "1"
    DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
    SGLANG_ENABLE_JIT_DEEPGEMM: "false"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
    MC_FORCE_MNNVL: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    CUDA_SCALE_LAUNCH_QUEUES: "4x"
    SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2: "1"
    DYN_REQUEST_PLANE: nats
  decode_environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "7200"
    PYTHONUNBUFFERED: "1"
    DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
    SGLANG_ENABLE_JIT_DEEPGEMM: "false"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_DECODE_BOOTSTRAP_TIMEOUT: "1000"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
    MC_FORCE_MNNVL: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    CUDA_SCALE_LAUNCH_QUEUES: "4x"
    SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2: "1"
    DYN_REQUEST_PLANE: nats
  sglang_config:
    prefill:
      served-model-name: "deepseek-ai/DeepSeek-R1"
      trust-remote-code: true
      quantization: "fp8"
      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl
      disaggregation-bootstrap-port: 30001
      load-balance-method: round_robin
      mem-fraction-static: 0.80
      max-prefill-tokens: 32768
      chunked-prefill-size: 32768
      enable-dynamic-chunking: true
      context-length: 136001
      max-running-requests: 2
      disable-cuda-graph: true
      tensor-parallel-size: 8
      data-parallel-size: 1
      expert-parallel-size: 1
      enable-dp-attention: false
      enable-dp-lm-head: false
      attention-backend: "trtllm_mla"
      kv-cache-dtype: "fp8_e4m3"
      moe-runner-backend: "flashinfer_trtllm"
      moe-dense-tp-size: 1
      fp8-gemm-backend: "flashinfer_trtllm"
      enable-flashinfer-allreduce-fusion: true
      stream-interval: 10
      watchdog-timeout: 1000000
      disable-radix-cache: true
    decode:
      served-model-name: "deepseek-ai/DeepSeek-R1"
      trust-remote-code: true
      quantization: "fp8"
      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl
      disaggregation-bootstrap-port: 30001
      mem-fraction-static: 0.85
      max-prefill-tokens: 32768
      chunked-prefill-size: 32768
      context-length: 136001
      max-running-requests: 2
      cuda-graph-max-bs: 32
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      data-parallel-size: 1
      expert-parallel-size: 1
      attention-backend: "trtllm_mla"
      kv-cache-dtype: "fp8_e4m3"
      moe-runner-backend: "flashinfer_trtllm"
      fp8-gemm-backend: "flashinfer_trtllm"
      enable-flashinfer-allreduce-fusion: true
      stream-interval: 10
      watchdog-timeout: 1000000
      disable-radix-cache: true

benchmark:
  type: "custom"
  command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"

health_check:
  # B200 long-context startup can exceed 20 minutes on cold workers before the
  # decode worker registers with the Dynamo health endpoint.
  max_attempts: 360
  interval_seconds: 10

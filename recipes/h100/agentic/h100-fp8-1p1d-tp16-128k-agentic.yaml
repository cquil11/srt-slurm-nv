# Long-context agentic H100 FP8 SGLang recipe.
#
# Based on recipes/h100/8k1k/stp/h100-fp8-1p1d-max-tp.yaml, with conservative
# single-request 128k limits and the InferenceX trace replay custom benchmark.
name: "h100-fp8-128k-agentic-1p1d-tp16"

model:
  path: "dsr1-fp8"
  container: "lmsysorg/sglang:v0.5.8-cu130"
  precision: "fp8"

resources:
  gpu_type: "h100"
  prefill_nodes: 2
  prefill_workers: 1
  decode_nodes: 2
  decode_workers: 1
  gpus_per_node: 8

infra:
  # H100 NFS/Pyxis startup can be slow enough that the default 5 minute
  # infra readiness timeout fires before setup_head emits logs.
  service_start_timeout_seconds: 1200

frontend:
  nginx_container: nginx-sqsh

backend:
  prefill_environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "7200"
    PYTHONUNBUFFERED: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
  decode_environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "7200"
    PYTHONUNBUFFERED: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
    SGLANG_DECODE_BOOTSTRAP_TIMEOUT: "1000"
  sglang_config:
    prefill:
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      watchdog-timeout: 1000000
      tp-size: 16
      dp-size: 1
      ep-size: 1
      enable-dp-attention: false
      attention-backend: "flashinfer"
      disable-radix-cache: true
      max-running-requests: 1
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl
      mem-fraction-static: 0.80
      context-length: 136001
      max-prefill-tokens: 32768
      chunked-prefill-size: 16384
      load-balance-method: "round_robin"
    decode:
      served-model-name: "deepseek-ai/DeepSeek-R1"
      model-path: "/model/"
      skip-tokenizer-init: true
      trust-remote-code: true
      watchdog-timeout: 1000000
      tp-size: 16
      dp-size: 1
      ep-size: 1
      enable-dp-attention: false
      attention-backend: "flashinfer"
      disable-radix-cache: true
      stream-interval: 10
      disaggregation-bootstrap-port: 30001
      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl
      mem-fraction-static: 0.85
      context-length: 136001
      max-running-requests: 1
      cuda-graph-max-bs: 1

benchmark:
  type: "custom"
  command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"

health_check:
  max_attempts: 120
  interval_seconds: 10

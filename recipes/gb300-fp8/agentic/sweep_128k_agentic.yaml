base:
  name: "gb300-fp8-128k-agentic-tp4-1p1d"

  dynamo:
    version: 0.8.1

  frontend:
    type: dynamo
    enable_multiple_frontends: true
    num_additional_frontends: 3
    nginx_container: nginx-sqsh

  infra:
    etcd_nats_dedicated_node: true

  model:
    path: "dsr1-fp8"
    container: "dynamo-sglang"
    precision: "fp8"

  resources:
    gpu_type: "gb300"
    prefill_nodes: 1
    prefill_workers: 1
    gpus_per_prefill: 4
    decode_nodes: 1
    decode_workers: 1
    gpus_per_decode: 4
    gpus_per_node: 4

  sbatch_directives:
    exclude: "im-gb300-r01-c011"

  backend:
    prefill_environment:
      TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "7200"
      PYTHONUNBUFFERED: "1"
      DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
      SGLANG_DG_CACHE_DIR: "/configs/dg-10212025"
      SGLANG_ENABLE_JIT_DEEPGEMM: "false"
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
      SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
      SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
      MC_TE_METRIC: "true"
      MC_FORCE_MNNVL: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_CUMEM_ENABLE: "1"
    decode_environment:
      TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "7200"
      PYTHONUNBUFFERED: "1"
      DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
      SGLANG_DG_CACHE_DIR: "/configs/dg-10212025"
      SGLANG_ENABLE_JIT_DEEPGEMM: "false"
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
      SGLANG_DECODE_BOOTSTRAP_TIMEOUT: "1000"
      SGLANG_HACK_SEQ_BOOTSTRAP_ROOM: "1"
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
      SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
      SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
      MC_TE_METRIC: "true"
      MC_FORCE_MNNVL: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_CUMEM_ENABLE: "1"
    sglang_config:
      prefill:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        trust-remote-code: true
        quantization: "fp8"
        disaggregation-mode: "prefill"
        disaggregation-transfer-backend: nixl
        disaggregation-bootstrap-port: 30001
        mem-fraction-static: 0.85
        max-prefill-tokens: 32768
        chunked-prefill-size: 32768
        enable-dynamic-chunking: true
        context-length: 136001
        max-running-requests: 2
        disable-cuda-graph: true
        tensor-parallel-size: 4
        pipeline-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        attention-backend: "trtllm_mla"
        kv-cache-dtype: "fp8_e4m3"
        moe-runner-backend: "flashinfer_trtllm"
        fp8-gemm-backend: "flashinfer_trtllm"
        enable-flashinfer-allreduce-fusion: false
        enable-symm-mem: false
        load-balance-method: "round_robin"
        stream-interval: 10
        watchdog-timeout: 1000000
        disable-radix-cache: true
        scheduler-recv-interval: 10
      decode:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        trust-remote-code: true
        quantization: "fp8"
        disaggregation-mode: "decode"
        disaggregation-transfer-backend: nixl
        disaggregation-bootstrap-port: 30001
        mem-fraction-static: 0.85
        max-prefill-tokens: 32768
        chunked-prefill-size: 32768
        context-length: 136001
        max-running-requests: 2
        cuda-graph-max-bs: 32
        tensor-parallel-size: 4
        pipeline-parallel-size: 1
        data-parallel-size: 1
        expert-parallel-size: 1
        attention-backend: "trtllm_mla"
        kv-cache-dtype: "fp8_e4m3"
        moe-runner-backend: "flashinfer_trtllm"
        fp8-gemm-backend: "flashinfer_trtllm"
        enable-flashinfer-allreduce-fusion: false
        enable-symm-mem: false
        prefill-round-robin-balance: true
        stream-interval: 10
        watchdog-timeout: 1000000
        disable-radix-cache: true
        scheduler-recv-interval: 1

  benchmark:
    type: "custom"
    command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
    env:
      INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
      RESULT_DIR: "/logs/agentic"
      PORT: "8000"
      IS_MULTINODE: "true"

  health_check:
    max_attempts: 360
    interval_seconds: 10

override_tp4_1p4d:
  name: "gb300-fp8-128k-agentic-tp4-1p4d"
  frontend:
    num_additional_frontends: 6
  resources:
    decode_nodes: 4
    decode_workers: 4
    gpus_per_decode: 4

override_dep8_1p1d:
  name: "gb300-fp8-128k-agentic-dep8-1p1d"
  resources:
    prefill_nodes: 2
    gpus_per_prefill: 8
    decode_nodes: 2
    gpus_per_decode: 8
  backend:
    decode_environment:
      SGLANG_ENABLE_JIT_DEEPGEMM: "true"
      SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "1024"
    sglang_config:
      prefill:
        mem-fraction-static: 0.75
        # SGLang partitions this across DP ranks; values below dp-size floor
        # the per-rank request budget to zero during scheduler init.
        max-running-requests: 16
        tensor-parallel-size: 8
        data-parallel-size: 8
        expert-parallel-size: 8
        enable-dp-attention: true
        disable-shared-experts-fusion: true
        eplb-algorithm: "deepseek"
        moe-runner-backend: null
        moe-a2a-backend: "deepep"
        deepep-mode: "normal"
        ep-dispatch-algorithm: "dynamic"
        moe-dense-tp-size: 1
        enable-dp-lm-head: true
        ep-num-redundant-experts: 32
        deepep-config: "/configs/deepep_config.json"
      decode:
        mem-fraction-static: 0.82
        max-running-requests: 16
        tensor-parallel-size: 8
        data-parallel-size: 8
        expert-parallel-size: 8
        enable-dp-attention: true
        disable-shared-experts-fusion: true
        eplb-algorithm: "deepseek"
        moe-runner-backend: "deep_gemm"
        moe-a2a-backend: "deepep"
        deepep-mode: "low_latency"
        ep-dispatch-algorithm: "static"
        moe-dense-tp-size: 1
        enable-dp-lm-head: true
        ep-num-redundant-experts: 32
        deepep-config: "/configs/deepep_config.json"


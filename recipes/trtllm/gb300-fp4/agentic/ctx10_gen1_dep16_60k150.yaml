# Long-context agentic variant of:
# recipes/trtllm/gb300-fp4/8k1k/stp/ctx10_gen1_dep16_batch256_eplb256_mtp0.yaml
# Retune the topology, context window, scheduling budgets, and custom trace
# replay benchmark for long-context agentic traces.
# The original 10xTP4 prefill shape could not retain 128k context on GB300:
# TensorRT-LLM clamped the attention window to roughly 65k tokens. Use 5xTP8
# prefill workers instead so each prefill worker has enough model/KV headroom.
# The original TP16/CUTEDSL decode shape also left too few KV blocks after
# executor allocation, causing TRTLLM to clamp the decode attention window to a
# few thousand tokens. Match the other 128k FP4 agentic recipes with TP8 decode
# and TRTLLM MoE so decode can retain long contexts.
# Use chunked prefill for long agentic traces: max_seq_len covers 128k input
# plus generation slack, while max_num_tokens is the per-step chunk budget.
name: "ctx5_gen1_dep8_128k_agentic_chunked"

model:
  path: "dsr1"
  container: "dynamo-trtllm"
  precision: "fp4"

resources:
  gpu_type: "gb300"
  prefill_nodes: 10
  prefill_workers: 5
  gpus_per_prefill: 8

  decode_workers: 1
  decode_nodes: 2
  gpus_per_decode: 8

  gpus_per_node: 4

backend:
  type: trtllm

  prefill_environment:
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    UCX_CUDA_IPC_ENABLE_MNNVL: "n"
    UCX_MAX_RMA_RAILS: "1"
    UCX_MAX_RNDV_RAILS: "1"
    UCX_RNDV_SCHEME: "put_zcopy"

  decode_environment:
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_FORCE_COMM_METHOD: "NVLINK_TWO_SIDED"
    UCX_CUDA_IPC_ENABLE_MNNVL: "n"
    UCX_MAX_RMA_RAILS: "1"
    UCX_MAX_RNDV_RAILS: "1"
    UCX_RNDV_SCHEME: "put_zcopy"

  trtllm_config:
    prefill:
      max_batch_size: 1
      max_num_tokens: 16384
      max_seq_len: 136192
      enable_chunked_prefill: true
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.5
        dtype: fp8
      cache_transceiver_config:
        # Chunked prefill limits compute memory, but disaggregated KV transfer
        # still needs a buffer large enough for the full long-context request.
        max_tokens_in_buffer: 136192
        backend: UCX

    decode:
      allreduce_strategy: MNNVL
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: false
      pipeline_parallel_size: 1
      max_batch_size: 16
      max_num_tokens: 256
      max_seq_len: 136192
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
      print_iter_log: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
        dtype: fp8
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      cache_transceiver_config:
        max_tokens_in_buffer: 136192
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4

benchmark:
  type: "custom"
  command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"

frontend:
  type: "dynamo"
  nginx_container: "nginx-sqsh"

health_check:
  # GB300 TRT decode can still be finishing CUDA graph warmup at 20 minutes.
  max_attempts: 300
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true

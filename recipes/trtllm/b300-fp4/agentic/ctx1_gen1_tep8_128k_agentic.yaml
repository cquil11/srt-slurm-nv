# Long-context agentic variant of:
# recipes/trtllm/b300-fp4/8k1k/stp/ctx1_gen3_tep8_batch16_eplb0_mtp0.yaml
# Keep a small 1P/1D B300 topology for first-pass validation, while using
# chunked prefill and full-request KV transfer buffers for 128k agentic traces.
name: "ctx1_gen1_tep8_128k_agentic"

model:
  path: "dsr1"
  container: "dynamo-trtllm"
  precision: "fp4"

resources:
  gpu_type: "b300"
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 2

  decode_workers: 1
  decode_nodes: 1
  gpus_per_decode: 8

  gpus_per_node: 8

backend:
  type: trtllm

  prefill_environment:
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    OMPI_MCA_coll_ucc_enable: "0"
    TLLM_ALL_RANK_LOG: "1"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    UCX_CUDA_IPC_ENABLE_MNNVL: "n"
    UCX_MAX_RMA_RAILS: "1"
    UCX_MAX_RNDV_RAILS: "1"
    UCX_RNDV_SCHEME: "put_zcopy"
    OMPI_MCA_btl: "tcp,self"
    OMPI_MCA_pml: "ob1"
    TRTLLM_UCX_INTERFACE: "enp115s0f0np0,enp115s0f1np1,enp243s0f0np0,enp243s0f1np1,enp131s0f0np0,enp131s0f1np1,enp227s0f0np0,enp227s0f1np1,enp147s0f0np0,enp147s0f1np1,enp99s0f0np0,enp99s0f1np1,enp19s0f0np0,enp19s0f1np1,enp3s0f0np0,enp3s0f1np1"

  decode_environment:
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    OMPI_MCA_coll_ucc_enable: "0"
    TLLM_ALL_RANK_LOG: "1"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    UCX_CUDA_IPC_ENABLE_MNNVL: "n"
    UCX_MAX_RMA_RAILS: "1"
    UCX_MAX_RNDV_RAILS: "1"
    UCX_RNDV_SCHEME: "put_zcopy"
    OMPI_MCA_btl: "tcp,self"
    OMPI_MCA_pml: "ob1"
    TRTLLM_UCX_INTERFACE: "enp115s0f0np0,enp115s0f1np1,enp243s0f0np0,enp243s0f1np1,enp131s0f0np0,enp131s0f1np1,enp227s0f0np0,enp227s0f1np1,enp147s0f0np0,enp147s0f1np1,enp99s0f0np0,enp99s0f1np1,enp19s0f0np0,enp19s0f1np1,enp3s0f0np0,enp3s0f1np1"

  trtllm_config:
    prefill:
      max_batch_size: 1
      max_num_tokens: 16384
      max_seq_len: 136192
      enable_chunked_prefill: true
      tensor_parallel_size: 2
      moe_expert_parallel_size: 2
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.5
        dtype: fp8
      cache_transceiver_config:
        max_tokens_in_buffer: 136192
        backend: UCX

    decode:
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      enable_attention_dp: false
      enable_lm_head_tp_in_adp: false
      pipeline_parallel_size: 1
      max_batch_size: 16
      max_num_tokens: 256
      max_seq_len: 136192
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
      print_iter_log: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
        dtype: fp8
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      cache_transceiver_config:
        max_tokens_in_buffer: 136192
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4
      allreduce_strategy: AUTO

benchmark:
  type: "custom"
  command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"

frontend:
  type: "dynamo"
  enable_multiple_frontends: false

health_check:
  max_attempts: 360
  interval_seconds: 10

dynamo:
  install: false

# Long-context agentic variant of:
# recipes/trtllm/h100-fp8/8k1k/stp/ctx1_gen3_tep16_batch1_eplb0_mtp0.yaml
name: "ctx1_gen1_tp16_128k_agentic"

model:
  path: "DeepSeek-R1-0528"
  container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post3"
  precision: "fp8"

resources:
  gpu_type: "h100"
  prefill_nodes: 2
  prefill_workers: 1
  gpus_per_prefill: 16

  decode_nodes: 2
  decode_workers: 1
  gpus_per_decode: 16

  gpus_per_node: 8

backend:
  type: trtllm

  prefill_environment:
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_DISABLE_KV_CACHE_TRANSFER_OVERLAP: "1"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_FORCE_ALLTOALL_METHOD: "DeepEP"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    UCX_CUDA_IPC_ENABLE_MNNVL: "n"

  decode_environment:
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    NCCL_NVLS_ENABLE: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_DISABLE_KV_CACHE_TRANSFER_OVERLAP: "1"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    UCX_CUDA_IPC_ENABLE_MNNVL: "n"

  trtllm_config:
    prefill:
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 136192
      cuda_graph_config: null
      disable_overlap_scheduler: true
      enable_attention_dp: true
      enable_chunked_prefill: true
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.3
      max_batch_size: 1
      max_num_tokens: 8192
      max_seq_len: 136192
      moe_config:
        backend: WIDEEP
        max_num_tokens: 8192
      moe_expert_parallel_size: 16
      pipeline_parallel_size: 1
      print_iter_log: true
      tensor_parallel_size: 16

    decode:
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 136192
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        enable_padding: true
      disable_overlap_scheduler: false
      enable_attention_dp: false
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      enable_lm_head_tp_in_adp: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
      max_batch_size: 4
      max_num_tokens: 256
      max_seq_len: 136192
      moe_config:
        backend: CUTLASS
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 16
      num_postprocess_workers: 4
      pipeline_parallel_size: 1
      print_iter_log: true
      stream_interval: 20
      tensor_parallel_size: 16

benchmark:
  type: "custom"
  command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"

frontend:
  type: "dynamo"
  enable_multiple_frontends: false

health_check:
  max_attempts: 360
  interval_seconds: 10

dynamo:
  install: false

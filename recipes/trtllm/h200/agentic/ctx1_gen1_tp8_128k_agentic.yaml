# Long-context agentic variant of:
# recipes/trtllm/h200/8k1k/stp/c1_ctx1_gen7_tep8_batch1_eplb0_mtp0.yaml
name: "ctx1_gen1_tp8_128k_agentic"

model:
  path: "dsr1"
  container: "nvcr.io#nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1.post1"
  precision: "fp8"

sbatch_directives:
  cpus-per-gpu: "16"

resources:
  gpu_type: "h200"
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 8

  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 8

  gpus_per_node: 8

backend:
  type: trtllm

  prefill_environment:
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"

  decode_environment:
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    UCX_TLS: "rc,dc,ud,cuda_copy,cuda_ipc,gdr_copy,tcp"

  trtllm_config:
    prefill:
      backend: pytorch
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 136192
      cuda_graph_config: null
      disable_overlap_scheduler: true
      enable_attention_dp: false
      enable_chunked_prefill: true
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.45
      max_batch_size: 1
      max_num_tokens: 16384
      max_seq_len: 136192
      moe_config:
        backend: CUTLASS
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      print_iter_log: true
      tensor_parallel_size: 8
      trust_remote_code: true

    decode:
      backend: pytorch
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 136192
      cuda_graph_config:
        enable_padding: true
        max_batch_size: 16
      disable_overlap_scheduler: false
      enable_attention_dp: false
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
      max_batch_size: 16
      max_num_tokens: 256
      max_seq_len: 136192
      moe_config:
        backend: CUTLASS
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      num_postprocess_workers: 4
      pipeline_parallel_size: 1
      print_iter_log: true
      stream_interval: 20
      tensor_parallel_size: 8
      trust_remote_code: true

benchmark:
  type: "custom"
  command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"

frontend:
  type: "dynamo"
  enable_multiple_frontends: false

health_check:
  max_attempts: 120
  interval_seconds: 10

dynamo:
  install: false

# Long-context agentic variant of:
# recipes/trtllm/gb200-fp4/8k1k/stp/ctx10_gen1_dep16_batch256_eplb256_mtp0.yaml
# Retune the topology, context window, prefill scheduling budget, and custom
# trace replay benchmark for long-context agentic traces.
# The original 10xTP4 prefill shape could not retain 128k context on GB200:
# TensorRT-LLM clamped the attention window to roughly 65k tokens. Use 5xTP8
# prefill workers instead so each prefill worker has enough model/KV headroom.
# Use chunked prefill for long agentic traces: max_seq_len covers 128k input
# plus generation slack, while max_num_tokens is the per-step chunk budget.
name: "ctx5_gen1_dep16_128k_agentic_chunked"

model:
  path: "dsr1"
  container: "dynamo-trtllm"
  precision: "fp4"

resources:
  gpu_type: "gb200"
  prefill_nodes: 10
  prefill_workers: 5
  gpus_per_prefill: 8

  decode_workers: 1
  decode_nodes: 4
  gpus_per_decode: 16

  gpus_per_node: 4

backend:
  type: trtllm

  prefill_environment:
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"

  decode_environment:
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"

  trtllm_config:
    prefill:
      max_batch_size: 1
      max_num_tokens: 16384
      max_seq_len: 136192
      enable_chunked_prefill: true
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.5
        dtype: fp8
      cache_transceiver_config:
        # Chunked prefill limits compute memory, but disaggregated KV transfer
        # still needs a buffer large enough for the full long-context request.
        max_tokens_in_buffer: 136192
        backend: UCX

    decode:
      tensor_parallel_size: 16
      moe_expert_parallel_size: 16
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: false
      pipeline_parallel_size: 1
      # Agentic traces are long-context/prefill-heavy. A 256-request decode
      # batch leaves too little KV capacity and TRT clamps the attention
      # window to a few thousand tokens.
      max_batch_size: 8
      max_num_tokens: 256
      max_seq_len: 136192
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
      print_iter_log: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
        dtype: fp8
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
        load_balancer:
          num_slots: 256
          layer_updates_per_iter: 1
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      cache_transceiver_config:
        max_tokens_in_buffer: 136192
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4

benchmark:
  type: "custom"
  command: "bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh"
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"

frontend:
  type: "dynamo"
  nginx_container: "nginx-sqsh"

health_check:
  # GB200 TRT decode can still be finishing CUDA graph warmup at 20 minutes.
  max_attempts: 150
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true
